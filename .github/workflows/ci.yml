name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://staging.example.com/api/v1
          VITE_AUTH_TOKEN_HEADER: x-maylove-token
          VITE_STORAGE_UPLOAD_URL: https://staging-storage.example.com/api/v1
